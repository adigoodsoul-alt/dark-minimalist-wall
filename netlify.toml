# Netlify: конфигурация проекта
# Документация: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Проект статический, сборка не требуется — публикуем корень репозитория
  publish = "."

# Кэширование статики и базовые заголовки безопасности
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# JS/CSS отдаём с обязательной ревалидацией: имена файлов не хэшируются,
# поэтому иначе после деплоя браузер час показывал бы старую версию.
# Браузер всё равно получит 304 Not Modified, если файл не менялся — трафика почти нет.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# index.html не кэшируем, чтобы правки подхватывались сразу
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
