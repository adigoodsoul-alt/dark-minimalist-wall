<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Отключаем нативный зум браузера на мобилках, чтобы работал наш собственный зум -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Dark Minimalist Wall</title>
    <meta name="description" content="Интерактивная доска в реальном времени: бесконечный холст с заметками и фото. Создавай, двигай и делись идеями вместе со всеми.">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0a0a0c">

    <!-- Open Graph (превью ссылки в мессенджерах и соцсетях) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Dark Minimalist Wall">
    <meta property="og:description" content="Интерактивная доска в реальном времени: создавай заметки и фото на бесконечном холсте.">

    <!-- Favicon (inline SVG, чтобы не было лишнего запроса и 404) -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0c'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%236366f1'/%3E%3C/svg%3E">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Caveat:wght@500;700&family=Playfair+Display:ital,wght@0,500;1,500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Библиотека для конвертации HEIC фото с iPhone (Apple).
         defer: не блокирует первую отрисовку, нужна только при выборе фото. -->
    <script defer src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

    <!-- Подключаем стили -->
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>

    <main id="viewport">
        <div id="wall"></div>
    </main>

    <div id="adminToggle">🔒</div>

    <div class="modal-backdrop" id="modalBackdrop">
        <div class="modal">
            <h2 id="modalTitle">Создать запись</h2>
            
            <div class="size-control">
                <label for="sizeInput">Масштаб: <span id="sizeValue">1x</span></label>
                <input type="range" id="sizeInput" min="0.5" max="2" step="0.1" value="1">
            </div>

            <div class="text-settings">
                <select id="bgStyleInput" title="Стиль карточки">
                    <option value="glass">🔲 С фоном</option>
                    <option value="transparent">🔲 Без фона</option>
                </select>
                <select id="fontInput" title="Шрифт">
                    <option value="'Inter', sans-serif">Шрифт: Обычный</option>
                    <option value="'Caveat', cursive">Маркер</option>
                    <option value="'Playfair Display', serif">Газетный</option>
                    <option value="'Roboto Mono', monospace">Код</option>
                </select>
                <input type="color" id="colorInput" value="#ededed" title="Выбрать цвет текста">
            </div>

            <textarea id="textInput" rows="3" placeholder="Напиши что-нибудь..."></textarea>

            <div class="author-control">
                <label for="authorInput">Подпись</label>
                <input type="text" id="authorInput" maxlength="40" placeholder="Ваше имя (необязательно)" autocomplete="nickname">
            </div>
            
            <p id="editImageNotice" style="display: none; font-size: 11px; color: var(--text-secondary);">
                *Картинку изменить нельзя. Чтобы заменить фото, создайте новую карточку.
            </p>

            <label class="custom-file-upload" id="uploadLabel">
                <input type="file" id="imageInput" accept="image/*,.heic,.heif">
                📎 Прикрепить картинку
            </label>
            <img id="imagePreview" src="" alt="preview">

            <div class="btn-group">
                <button class="btn btn-cancel" id="cancelBtn">Отмена</button>
                <button class="btn btn-add" id="addBtn">Опубликовать</button>
            </div>
        </div>
    </div>

    <!-- Основной скрипт логики -->
    <script type="module" src="app.js?v=5"></script>
</body>
</html>
